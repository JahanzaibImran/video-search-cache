name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fully mocked: every request needs an MSW handler, and any attempt to reach
      # the real network fails the test (src/test/network-guard.ts). The keys are
      # blanked so nothing could be charged even if a guard were bypassed.
      - name: Test
        run: npm test
        env:
          YOUTUBE_API_KEY: ""
          SCRAPECREATORS_API_KEY: ""

      # No API key in CI on purpose: the build must succeed without one.
      - name: Build
        run: npm run build
